services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: astral-nexus-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AstralNexus!2026"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - astral_nexus_sql_data:/var/opt/mssql
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astral-nexus-app
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AstralNexusDb;User Id=sa;Password=AstralNexus!2026;TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
    ports:
      - "5092:8080"
    restart: unless-stopped

volumes:
  astral_nexus_sql_data:
